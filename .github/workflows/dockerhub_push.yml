name: DockerHub Push

on:
  repository_dispatch:
    types: [docker]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Check out repository
        uses: actions/checkout@v2

      -
        name: Get commit
        run: echo "WARTHOG_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version
        id: get_version
        run: |
          echo "VERSION=$(grep 'version :' meson.build | cut -d "'" -f 2)" >> $GITHUB_ENV
      -
        name: Build and push
        uses: docker/build-push-action@v5
        with:
          file: ./dockerfiles/Dockerfile
          build-args: |
            WARTHOG_COMMIT=${{ env.WARTHOG_COMMIT }}
          push: true
          tags: |
            zzjulien/warthog_node:latest
            zzjulien/warthog_node:${{ env.VERSION }}
